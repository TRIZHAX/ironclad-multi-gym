services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: ironclad
    ports:
      - "5432:5432"
    volumes:
      - gym_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d ironclad"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gym_postgres:

